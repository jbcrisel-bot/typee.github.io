<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Long-form, evidence-based reviews of books, policies, treaties, summits, and speeches in U.S. foreign policy."><title>Reviews on the International Affairs of the United States of America</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;display=swap"><style id="app-style">
:root{--bg:#0a1730;--pn:#10234a;--ln:#23396a;--tx:#e8ecf4;--mu:#9fb0cc;--ac:#d6b56c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.75 Newsreader,Georgia,serif}
a{color:var(--ac)}.ui,button,input,select,textarea,nav{font-family:Inter,system-ui,sans-serif}
.w{max-width:880px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--ln);padding:28px 0 16px}
.sub{color:var(--mu);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
.brand{display:block;color:var(--tx);text-decoration:none;font:500 clamp(22px,3.4vw,30px)/1.25 Newsreader,Georgia,serif}
nav{display:flex;gap:22px;margin-top:14px;font-size:14px;align-items:center}
nav a{color:var(--mu);text-decoration:none}nav a:hover,nav a.on{color:var(--ac)}
.meta{color:var(--mu);font-size:13px;margin:0}
h1{font:600 clamp(30px,5vw,42px)/1.2 Newsreader,Georgia,serif;margin:.3em 0}
h2{font:600 24px/1.3 Newsreader,Georgia,serif;margin:1.8em 0 .4em}
.essay{max-width:680px;margin:40px auto}.essay p{margin:0 0 1.1em}
sup a{text-decoration:none;font:600 12px Inter,sans-serif}
.notes{border-top:1px solid var(--ln);margin-top:2.5em;padding-top:1em;font-size:15px;color:var(--mu);line-height:1.6}
.notes h3{font:600 12px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--tx);margin:1.2em 0 .5em}
.feat{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:28px;margin:36px 0}
.feat h2{margin:.2em 0}.feat p{margin:.4em 0}
.item{padding:20px 0;border-bottom:1px solid var(--ln)}
.item h3{margin:.2em 0;font:600 22px/1.3 Newsreader,Georgia,serif}
.item p{margin:.3em 0 0;color:var(--mu);font-size:16px}
a.t{color:var(--tx);text-decoration:none}a.t:hover{color:var(--ac)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 4px}
input,select,textarea{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:9px 11px;font-size:14px;width:100%}
.bar input{flex:2 1 200px;width:auto}.bar select{flex:1 1 150px;width:auto}
button{background:var(--ac);color:#0a1730;border:0;border-radius:6px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
button.g{background:none;color:var(--ac);border:1px solid var(--ln)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.row>div{flex:1 1 150px}
label{display:block;font-size:12px;color:var(--mu);margin:14px 0 5px;letter-spacing:.04em;text-transform:uppercase}
textarea{min-height:120px;line-height:1.5;font-size:15px}
.tag{color:var(--ac);font-size:13px;font-weight:600}.hint{color:var(--mu);font-size:12px;margin:4px 0 0}
footer{border-top:1px solid var(--ln);margin-top:60px;padding:22px 0 40px;color:var(--mu);font-size:13px;line-height:1.6}
</style></head><body><div id="app"></div><script id="data" type="application/json">{"reviews":[],"featured":null,"contact":"N/A","about":"This site publishes long-form, evidence-based reviews of how the United States conducts its international affairs: books on U.S. foreign policy, policy decisions and treaties, diplomatic summits, and speeches.\n\nEach review aims to be balanced and academic. Claims are supported by citations, and every essay ends with notes and further reading so that readers can check the evidence for themselves.\n\nA note on perspective: these reviews reflect the author’s own analysis. They are written for general readers and policy specialists alike, and readers are encouraged to consult the cited sources and draw their own conclusions."}</script><script id="app-code">
const D=JSON.parse(document.getElementById('data').textContent),app=document.getElementById('app'),$=s=>document.querySelector(s);
const REG=['Europe','Middle East','Indo-Pacific','Africa','Latin America','Russia & Eurasia','Global'],TOP=['Diplomacy','Defense & Security','Trade & Economics','Human Rights','Alliances','Arms Control','Intelligence','History'],TYP=['Book','Policy decision','Treaty','Summit','Speech'];
let admin=false,art=null,ed=null,pe=null,flt={q:'',r:'',t:''};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lk=s=>s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/([\w.+-]+@[\w-]+\.[\w.-]+)/g,m=>m.includes('/')?m:'<a href="mailto:'+m+'">'+m+'</a>');
const fd=d=>new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
const ln=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);
const bd=t=>esc(t).split(/\n\s*\n/).filter(p=>p.trim()).map(p=>/^##\s/.test(p)?'<h2>'+p.slice(3)+'</h2>':'<p>'+lk(p).replace(/\[(\d+)\]/g,'<sup><a href="#" data-n="n$1">$1</a></sup>').replace(/\n/g,'<br>')+'</p>').join('');
const opts=(a,v,all)=>(all?'<option value="">'+all+'</option>':'')+a.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');
const ex=r=>{const p=(r.body.split(/\n\s*\n/).find(x=>x.trim()&&!/^##/.test(x))||'').replace(/\[\d+\]/g,'');return esc(p.slice(0,230))+(p.length>230?'…':'')};
const blank=()=>({title:'',type:TYP[0],region:REG[0],topic:TOP[0],body:'',notes:'',reading:'',feat:false});
const lsGet=()=>{try{return JSON.parse(localStorage.getItem('rv_draft'))}catch(e){return null}};
const lsSet=v=>{try{v?localStorage.setItem('rv_draft',JSON.stringify(v)):localStorage.removeItem('rv_draft')}catch(e){}};
const head=()=>['meta[charset]','meta[name=viewport]','meta[name=description]','title','link[href*="fonts.googleapis"]'].map(s=>document.head.querySelector(s).outerHTML).join('');
const build=()=>'<!doctype html>\n<html lang="en"><head>'+head()+'<style id="app-style">'+$('#app-style').textContent+'</style></head><body><div id="app"></div><script id="data" type="application/json">'+JSON.stringify(D).replace(/</g,'\\u003c')+'<\/script><script id="app-code">'+$('#app-code').textContent+'<\/script></body></html>';
function save(fn){fn();ed=null;pe=null;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([build()],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();render();alert('Done. A new file called index.html was just downloaded. Upload it to GitHub, replacing the old index.html, to make this change live for everyone.')}
function nav(){const h=location.hash.slice(1),c=x=>h===x?'on':'';return '<header><div class="w"><p class="sub ui">An academic review series</p><a class="brand" href="#">Reviews on the International Affairs of the United States of America</a><nav><a href="#" class="'+(!h||h.startsWith('review-')?'on':'')+'">Reviews</a><a href="#about" class="'+c('about')+'">About</a><a href="#contact" class="'+c('contact')+'">Contact</a>'+(admin?'<button data-a="new" style="margin-left:auto">Write a review</button>':'')+'</nav></div></header>'}
function rv(r,pv){const n=ln(r.notes),f=ln(r.reading),b=(a,x)=>' data-a="'+a+'" data-id="'+x+'"';
return '<article class="essay"><p class="meta ui">'+(pv?'<span class="tag">Preview — not published</span> · ':'')+esc(r.type)+' · '+esc(r.region)+' · '+esc(r.topic)+'</p><h1>'+esc(r.title)+'</h1><p class="meta ui">'+fd(r.date||new Date())+'</p>'+bd(r.body)
+(n.length||f.length?'<div class="notes">'+(n.length?'<h3>Notes</h3><ol>'+n.map((x,i)=>'<li id="n'+(i+1)+'">'+lk(esc(x))+'</li>').join('')+'</ol>':'')+(f.length?'<h3>Further reading</h3><ul>'+f.map(x=>'<li>'+lk(esc(x))+'</li>').join('')+'</ul>':'')+'</div>':'')
+(admin&&!pv?'<div class="row ui"><button class="g"'+b('edit',r.id)+'>Edit</button><button class="g"'+b('feat',r.id)+'>'+(D.featured===r.id?'Remove from front page':'Feature on front page')+'</button><button class="g"'+b('del',r.id)+'>Delete</button></div>':'')+'</article>'}
function home(){const f=D.reviews.find(r=>r.id===D.featured),u='#review-'+(f&&f.id);
return (f?'<section class="feat"><p class="tag ui">Featured review</p><h2><a class="t" href="'+u+'">'+esc(f.title)+'</a></h2><p class="meta ui">'+esc(f.type)+' · '+esc(f.region)+' · '+fd(f.date)+'</p><p>'+ex(f)+'</p><a class="ui" href="'+u+'">Read the full review →</a></section>':'')
+(D.reviews.length?'<div class="bar ui"><input id="q" placeholder="Search reviews" value="'+esc(flt.q)+'"><select id="fr">'+opts(REG,flt.r,'All regions')+'</select><select id="ft">'+opts(TOP,flt.t,'All topics')+'</select></div><div id="list"></div>':'<div class="item"><p>'+(admin?'No reviews yet. Choose “Write a review” above to publish your first one.':'The first review is on its way. Check back soon.')+'</p></div>')}
function list(){const el=$('#list');if(!el)return;const q=flt.q.toLowerCase();
const a=D.reviews.filter(r=>(!flt.r||r.region===flt.r)&&(!flt.t||r.topic===flt.t)&&(!q||(r.title+' '+r.body).toLowerCase().includes(q))).sort((x,y)=>y.date.localeCompare(x.date));
el.innerHTML=a.length?a.map(r=>'<div class="item"><p class="meta ui">'+esc(r.type)+' · '+esc(r.region)+' · '+esc(r.topic)+' · '+fd(r.date)+'</p><h3><a class="t" href="#review-'+r.id+'">'+esc(r.title)+'</a></h3><p>'+ex(r)+'</p></div>').join(''):'<div class="item"><p>No reviews match those filters.</p></div>'}
function pg(k){const T=k==='about'?'About':'Contact';
if(pe===k)return '<div class="essay ui"><h1>'+T+'</h1><label>Page text (a blank line starts a new paragraph)</label><textarea id="pt" style="min-height:260px">'+esc(D[k])+'</textarea><div class="row"><button data-a="psave" data-k="'+k+'">Save &amp; download site file</button><button class="g" data-a="pcancel">Cancel</button></div></div>';
return '<div class="essay"><h1>'+T+'</h1>'+(D[k]?bd(D[k]):'<p>Contact details haven’t been added yet.</p>')+(admin?'<div class="row ui"><button class="g" data-a="pedit" data-k="'+k+'">Edit this page</button></div>':'')+'</div>'}
function editor(){const r=ed,t=(l,i,v,h)=>'<label>'+l+'</label><textarea id="'+i+'"'+(h?' style="min-height:'+h+'px"':'')+'>'+esc(v)+'</textarea>';
if(r.pv)return rv(r,true)+'<div class="row ui" style="max-width:680px;margin:0 auto"><button data-a="pub">Save &amp; download site file</button><button class="g" data-a="back">Back to editing</button></div>';
return '<div class="essay ui" style="max-width:760px"><h1 style="font-family:Newsreader,Georgia,serif">'+(r.id?'Edit review':'New review')+'</h1><label>Title</label><input id="e-title" value="'+esc(r.title)+'"><div class="row"><div><label>Type</label><select id="e-type">'+opts(TYP,r.type)+'</select></div><div><label>Region</label><select id="e-reg">'+opts(REG,r.region)+'</select></div><div><label>Topic</label><select id="e-top">'+opts(TOP,r.topic)+'</select></div></div>'
+t('Review text','e-body',r.body,380)+'<p class="hint">Paste your essay here. Leave a blank line between paragraphs, start a line with ## for a subheading, and type [1], [2]… where a footnote belongs.</p>'
+t('Notes — one per line, note 1 first','e-notes',r.notes)+t('Further reading — one per line','e-read',r.reading)
+'<label style="text-transform:none;font-size:14px;color:var(--tx)"><input type="checkbox" id="e-feat" style="width:auto"'+(r.feat?' checked':'')+'> Feature this review on the front page</label><div class="row"><button data-a="pub">Save &amp; download site file</button><button class="g" data-a="prev">Preview</button><button class="g" data-a="draft">Save draft</button><button class="g" data-a="cancel">Cancel</button></div><p class="hint" id="e-msg"></p></div>'}
function render(){const h=location.hash.slice(1);let m;
if(ed)m=editor();else if(h==='about'||h==='contact')m=pg(h);
else if(h.startsWith('review-')){const r=D.reviews.find(x=>x.id===h.slice(7));m=r?rv(r):'<div class="essay"><p>That review could not be found.</p></div>'}
else m=home();
app.innerHTML=nav()+'<main class="w">'+m+'</main><footer><div class="w">Reviews reflect the author’s own analysis and aim to be balanced and evidence-based. Readers are encouraged to consult the cited sources and reach their own conclusions.</div></footer>';list()}
const grab=()=>{if(!$('#e-title'))return;Object.assign(ed,{title:$('#e-title').value.trim(),type:$('#e-type').value,region:$('#e-reg').value,topic:$('#e-top').value,body:$('#e-body').value.trim(),notes:$('#e-notes').value,reading:$('#e-read').value,feat:$('#e-feat').checked})};
app.addEventListener('click',async e=>{const b=e.target.closest('[data-a],[data-n]');if(!b)return;
if(b.dataset.n){e.preventDefault();const t=document.getElementById(b.dataset.n);t&&t.scrollIntoView({block:'center'});return}
const a=b.dataset.a,id=b.dataset.id,k=b.dataset.k;
if(a==='new'){ed=lsGet()||blank();location.hash='';render()}
else if(a==='cancel'){ed=null;render()}
else if(a==='draft'){grab();lsSet(ed);$('#e-msg').textContent='Draft saved in this browser. Choose “Write a review” to pick it back up.'}
else if(a==='prev'){grab();if(!ed.title||!ed.body){$('#e-msg').textContent='Add a title and the review text first.';return}ed.pv=true;ed.date=ed.date||new Date().toISOString();render();scrollTo(0,0)}
else if(a==='back'){ed.pv=false;render()}
else if(a==='pub'){grab();if(!ed.title||!ed.body){alert('Add a title and the review text first.');return}
const r={...ed};delete r.pv;r.date=r.id?r.date:new Date().toISOString();r.id=r.id||Date.now().toString(36);
await save(()=>{const i=D.reviews.findIndex(x=>x.id===r.id),f=r.feat;delete r.feat;i<0?D.reviews.push(r):D.reviews[i]=r;if(f)D.featured=r.id;else if(D.featured===r.id)D.featured=null;if(!ed.id)lsSet(null);location.hash='review-'+r.id})}
else if(a==='edit'){ed={...D.reviews.find(x=>x.id===id),feat:D.featured===id};render()}
else if(a==='feat')save(()=>{D.featured=D.featured===id?null:id});
else if(a==='del'){if(confirm('Delete this review permanently?'))save(()=>{D.reviews=D.reviews.filter(x=>x.id!==id);if(D.featured===id)D.featured=null;location.hash=''})}
else if(a==='pedit'){pe=k;render()}else if(a==='pcancel'){pe=null;render()}
else if(a==='psave'){const v=$('#pt').value.trim();save(()=>{D[k]=v;pe=null})}});
app.addEventListener('input',e=>{if(e.target.id==='q'){flt.q=e.target.value;list()}});
app.addEventListener('change',e=>{if(e.target.id==='fr'){flt.r=e.target.value;list()}if(e.target.id==='ft'){flt.t=e.target.value;list()}});
addEventListener('hashchange',()=>{ed=null;pe=null;render();scrollTo(0,0)});
try{if(location.hash==='#admin'){sessionStorage.setItem('adm','1');history.replaceState(null,'',location.pathname)}admin=sessionStorage.getItem('adm')==='1'}catch(e){}
render();
</script></body></html>
